variables:
  CI:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  FIREBASE_KEY_PATH:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  GITHUB_TOKEN:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [env_path]

files:
  ../../:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../]
  ../../../:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [os.path.dirname(), ../../../]
  .env:
    type: literal
    actions: [read]
    params:
      path: [project_root]
      caller: [set_google_cloud_env_vars, __init__]
  input_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  key_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  output_path:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load]
      alias: [f]
  overrides_path:
    type: variable
    actions: [read]
    params:
      caller: [open, json.load]
      alias: [f]
  path:
    type: variable
    actions: [read, delete]
    params:
      caller: [os.path.exists, os.remove]

networks:
  ANSWER_GENERATOR_AGENT:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      caller: [extract_portfolio_data]
      pattern: https://https://{...}
  url:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{url}
      caller: [_validate_url]
      dynamic: "True"
      variable: url
