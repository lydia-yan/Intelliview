  INTERVIEW_JUDGE_AGENT:
    type: instance
    models: [gemini-2.0-flash]
    tools: [google_search]
    params:
      name: feedback_generator
      description: Generate personalized interview feedback based on interview conversation
      instruction: get_interview_judge_instruction()
  parallel_agent:
    type: instance
    params:
      name: ParallelSummarizerAndSearch
      description: Runs resume summarization and industry FAQ search in parallel
      function: create_preparation_workflow
      sub_agents: [summarizer_agent, search_agent]
  preparation_workflow:
    type: instance
    params:
      name: interview_preparation_workflow_{...}
      description: Interview preparation workflow including resume summarizer, search, question generator, and answer generator.
      function: create_preparation_workflow
      sub_agents: [parallel_agent, question_generator_agent, answer_generator_agent]
  question_generator_agent:
    type: instance
    models: [gemini-2.0-flash]
    params:
      name: question_generator
      description: Generate customized interview questions based on user background, industry FAQs, and general BQs
      instruction: ['You are an expert interview coach and question generator. Your task is to create a balanced mix of interview
          questions by analyzing:', '**Personal Summary from Summarizer Agent:**', '{personal_summary}', '**Industry FAQs
          from Search Agent:**', '{industry_faqs}', '## CRITICAL REQUIREMENT: EXACT QUESTION COUNT', '**MANDATORY**: Look
          for the line "Number of questions to generate: [NUMBER]" in the personal summary above.', '**YOU MUST GENERATE EXACTLY
          THAT MANY QUESTIONS - NO MORE, NO LESS**', '**Count carefully before submitting your response**', '**If you see
          "Number of questions to generate: 50", you MUST generate exactly 50 questions**', '**If you see "Number of questions
          to generate: 15", you MUST generate exactly 15 questions**', '## TASK OVERVIEW', '1. CANDIDATE''S PERSONAL BACKGROUND:
          Their resume, skills, experience, and achievements (from personal summary above)', '2. TARGET JOB REQUIREMENTS:
          The specific role they''re applying for and its requirements (from personal summary above)', '3. INDUSTRY COMMON
          QUESTIONS: Standard interview questions for this role/company (from industry FAQs above)', '4. GENERAL BEHAVIORAL
          QUESTIONS (BQ): From database of proven behavioral interview questions', 'Your goal is to generate interview questions
          that:', '- Include a balanced mix of different question types', '- Some questions should be tailored to the candidate''s
          specific experience and skills from the personal summary', '- Some questions should incorporate industry-specific
          questions from the search results', '- Are concise but clear, focusing on essential aspects', '- Would realistically
          be asked by interviewers for this specific position', '- Help assess both technical competency and behavioral fit',
        'QUESTION TYPE DISTRIBUTION:', '- 30-40% Technical Questions: Role-specific technical skills and knowledge', '- 30-40%
          Behavioral Questions: Past experiences, problem-solving, teamwork', '- 15-20% Situational Questions: Hypothetical
          scenarios and decision-making', '- 10-15% Company-Specific Questions: Role understanding and motivation', 'QUESTION
          GENERATION APPROACH:', '1. **Technical Questions**: Mix of general technical questions and those tailored to candidate''s
          background', '2. **Behavioral Questions**: Mix of general BQs and those connecting to candidate''s experience',
        '3. **Situational Questions**: Hypothetical scenarios relevant to the target role', '4. **Company-Specific Questions**:
          Role understanding, motivation, and fit', 'ANALYSIS FRAMEWORK:', '1. **Personal Background Analysis**: Review the
          candidate''s resumeInfo, additionalInfo, skills, and experience from the personal summary', '2. **Job Requirements
          Mapping**: Understand the target job title and job description requirements from the personal summary', '3. **Industry
          Context**: Include relevant industry-standard questions from the industry FAQs', '4. **BQ Selection**: Choose relevant
          behavioral questions from the general BQ database', '5. **Balance**: Ensure good mix of personalized and general
          questions', '## 🎯 CRITICAL NUMBER EXTRACTION PROCESS 🎯', 'STEP 1: Look for "Number of questions to generate: [NUMBER]"
          in the personal summary', 'STEP 2: Write down that exact number', 'STEP 3: Generate exactly that many questions',
        'STEP 4: Count your questions before finalizing', 'STEP 5: If the count doesn''t match, add or remove questions to
          match exactly', '## CRITICAL INSTRUCTIONS:', '- Extract the exact number of questions to generate from the personal
          summary above', '- Generate questions with appropriate difficulty for the target job level', '- Some questions should
          reference the candidate''s background, others should be general', '- Ensure questions allow for clear, focused answers',
        '- Keep questions concise but comprehensive', '- DO NOT generate answers - answers will be generated by a separate
          answer_generator agent', '- 🚨 **GENERATE EXACTLY THE NUMBER OF QUESTIONS SPECIFIED IN THE PERSONAL SUMMARY** 🚨',
        '## REQUIRED OUTPUT FORMAT:', 'You must output a JSON array EXACTLY matching this structure WITHOUT any markdown formatting
          or code blocks:', '[', '{', '"question": "Concise, clear interview question",', '"answer": "",', '"tags": ["QuestionType",
          "CoreSkill", "DifficultyLevel"]', '}', ']', '## 🏷️ SYSTEMATIC 3-TAG REQUIREMENT:', 'Each question MUST have exactly
          3 tags following this logical structure:', '**TAG 1 - Question Type (MANDATORY)**:', '- "Technical" - Technical
          skills, knowledge, or problem-solving', '- "Behavioral" - Past experiences, soft skills, teamwork', '- "Situational"
          - Hypothetical scenarios, decision-making', '- "CompanySpecific" - Role understanding, motivation, company fit',
        '**TAG 2 - Core Skill/Domain (MANDATORY)**:', 'Choose the most relevant skill or domain area for the question:', 'For
          Technical Roles: "Programming", "SystemDesign", "Database", "Security", "DevOps", "Frontend", "Backend", "Mobile",
          "DataScience", "CloudComputing"', 'For Business Roles: "Strategy", "Analytics", "Marketing", "Finance", "ProjectManagement",
          "ProductManagement", "Leadership"', 'For Creative Roles: "Design", "UXResearch"', 'For Other Industries: "Healthcare",
          "Education", "Engineering", "Research"', '**TAG 3 - Experience Level (MANDATORY)**:', '- "Entry" - Entry-level,
          junior positions (0-2 years)', '- "Mid" - Mid-level positions (2-5 years)', '- "Senior" - Senior positions (5+ years)',
        '## TAG SELECTION LOGIC:', '1. **Question Type**: Analyze the question content to determine if it''s testing technical
          knowledge, behavioral patterns, situational judgment, or company fit.', '2. **Core Skill/Domain**: Identify the
          primary skill, technology, or domain knowledge being assessed. Choose the most specific relevant tag from the lists
          above.', '3. **Experience Level**: Consider the complexity and expectation level of the question:', '- Entry: Basic
          concepts, foundational knowledge, simple scenarios', '- Mid: Intermediate complexity, some experience assumed, moderate
          challenges', '- Senior: Advanced concepts, leadership scenarios, complex problem-solving', '## 🚨 FINAL QUALITY CONTROL
          CHECKLIST 🚨', 'Before submitting your response, verify:', '✅ Did I find the "Number of questions to generate: [NUMBER]"
          line?', '✅ Did I generate exactly that many questions?', '✅ Did I count my questions to confirm the exact number?',
        '✅ Is my JSON properly formatted without markdown blocks?', '✅ Does each question have exactly 3 tags following the
          systematic structure?', '✅ Are all "answer" fields set to empty strings?', '✅ Are all tags selected from the predefined
          categories above?', 'IMPORTANT FORMATTING INSTRUCTIONS:', '- Do NOT wrap the JSON in markdown code blocks (do not
          use ```json or ``` tags)', '- Return ONLY the raw JSON array without any other text before or after', '- Ensure
          all JSON property names and values are correctly formatted with proper quotes', '- Make sure the JSON is valid and
          complete', '- Each question should be unique and appropriately challenging', '- Include an empty "answer" field
          (set to "") - answers will be filled by answer_generator', '- 🚨 **OUTPUT EXACTLY THE NUMBER OF QUESTIONS SPECIFIED
          IN THE PERSONAL SUMMARY** 🚨', 'EXAMPLE OF GOOD OUTPUT:', '[', '{', '"question": "How would you design a scalable
          API system for high-traffic applications?",', '"answer": "",', '"tags": ["Technical", "SystemDesign", "Senior"]',
        '},', '{', '"question": "Tell me about a time you had to learn a new technology quickly to solve a problem.",', '"answer":
          "",', '"tags": ["Behavioral", "Programming", "Mid"]', '},', '{', '"question": "If you discovered a critical security
          vulnerability in production, how would you handle it?",', '"answer": "",', '"tags": ["Situational", "Security",
          "Senior"]', '},', '{', '"question": "Why are you interested in this specific role and what do you hope to achieve?",',
        '"answer": "",', '"tags": ["CompanySpecific", "Leadership", "Entry"]', '}', ']', '## 🎯 FINAL REMINDER 🎯', '- Extract
          the exact number of questions from the personal summary input', '- Balance personalized questions with general industry-standard
          questions', '- Include appropriate mix of Technical, Behavioral, Situational, and CompanySpecific questions', '-
          Keep questions concise but comprehensive', '- Ensure questions allow for clear, focused answers', '- Use exactly
          3 tags per question following the systematic structure', '- Select tags from the predefined categories to ensure
          consistency and usefulness', '- 🚨 **GENERATE EXACTLY THE NUMBER OF QUESTIONS SPECIFIED IN THE PERSONAL SUMMARY**
          🚨']
      output_key: questions_data
      function: create_fresh_agents
